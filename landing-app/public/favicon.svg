<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="geometricPrecision" role="img" aria-label="墨笔">
  <!-- 墨笔 · MoBi favicon · 纯黑白线描(素描风,呼应玄鉴 logo 体系)
       毛笔为主体:描边笔杆 + 描边笔锋(软毫) + 实心锋尖 + 淡墨迹一笔。
       透明底;深色主题按 fg/bg 变量自动反白。16px 下仍可辨。-->
  <style>
    :root { --fg: #111; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; } }
  </style>
  <g transform="rotate(34 16 16)"
     stroke="var(--fg, #111)" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 笔杆 -->
    <rect x="14" y="3.2" width="4" height="12" rx="2"/>
    <!-- 笔箍 -->
    <line x1="13.5" y1="15.4" x2="18.5" y2="15.4"/>
    <!-- 笔锋(软毫轮廓) -->
    <path d="M13.2 15.6 C 12 20.2, 13.6 25.4, 16 29 C 18.4 25.4, 20 20.2, 18.8 15.6"/>
    <!-- 笔毫细线(素描感,淡) -->
    <path d="M16 17.8 L 15 26.6" stroke-width="1" opacity="0.4"/>
    <path d="M16 17.8 L 17 25.6" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- 实心锋尖(点睛) -->
  <circle cx="8.7" cy="26.8" r="1.45" fill="var(--fg, #111)"/>
  <!-- 淡墨迹一笔(自锋尖淌出,呼应玄鉴次级线) -->
  <path d="M8.9 27 C 12.6 28.2, 17 27.8, 20.6 26"
        fill="none" stroke="var(--fg, #111)" stroke-width="1.5"
        stroke-linecap="round" opacity="0.32"/>
</svg>
