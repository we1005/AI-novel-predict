# Netlify 配置 · 墨笔落地页(工程化版)
#
# 用法:
#   本地构建:  cd landing-app && npm install && npm run build
#   部署:      netlify deploy --prod --dir=landing-app/dist
#
# 也支持 Netlify 连 GitHub 自动构建(base/command/publish 已写好)。

[build]
  base = "landing-app"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 单页站:所有路径回落 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
